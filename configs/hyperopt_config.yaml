# =============================================================================
#  Hyperparameter Search Space — FashionMNIST (Người 1)
# =============================================================================
#  This file is the single source of truth for what the search sweeps over.
#  `run_experiments.py` reads it and passes the structure to
#  HyperparameterTuner.grid_search().
#
#  Strategy: **Grid search** (deterministic — every cell of the Cartesian
#  product is evaluated, nothing is sampled, so the run is fully
#  reproducible and no good cell can be missed).
#
#  Keys supported by `train_with_params`:
#    - model_name      (must be in ModelFactory)
#    - learning_rate   (float)
#    - batch_size      (int)        — note: ignored at the trial level because
#                                    we re-use the loaders provided to the
#                                    tuner. Kept here for documentation and
#                                    to feed results.json.
#    - optimizer       ("adam" | "sgd")
#    - weight_decay    (float)
#    - dropout         (float, only used by models with dropout)
#    - epochs          (int, per trial)
# =============================================================================

strategy: grid            # grid search (Cartesian product, exhaustive)

# Common to all trials
epochs_per_trial: 10
seed: 42

# The four candidate architectures. All of them are tuned under the *same*
# set of hyperparameters so the comparison is controlled — every model is
# brought to its own best configuration before the final pick is made.
models:
  - baseline_mlp
  - deep_mlp
  - simple_cnn
  - resnet_mini

# The Cartesian product below is evaluated **exhaustively**:
#   4 models x 2 learning rates x 2 optimizers = 16 trials
#   16 trials x 10 epochs = 160 training epochs
grid_search:
  model_name:
    - baseline_mlp
    - deep_mlp
    - simple_cnn
    - resnet_mini
  learning_rate:
    - 0.001
    - 0.0005
  optimizer:
    - adam
    - sgd
  epochs: 10

# Optional cheap pruning (kept here for documentation; the current
# scheduler does not actively prune, but it filters results after the fact).
prune_below: 60.0

# Where reports land
output:
  dir: results/runs
  filename_prefix: hyperopt
